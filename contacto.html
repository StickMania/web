<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="description" content="Conoce la historia de StickMania, la tienda líder en arcade sticks en Perú.">
    <meta name="keywords" content="Arcade Sticks, Tienda Arcade, Retro">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/contacto.css">
    <link rel="icon" href="img/favicon.png" type="image/png">
    <title>Contacto | StickMania</title>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold neon-text" href="#">🕹️ StickMania</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li>
                    <li class="nav-item"><a class="nav-link" href="historia.html">Historia</a></li>
                    <li class="nav-item"><a class="nav-link active" href="#">Contacto</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <header class="hero-section text-white text-center py-5">
        <div class="container">
            <h1 class="display-4 fw-bold animate-fade-up">Contáctanos</h1>
            <p class="lead animate-fade-up delay-1">¿Tienes dudas o sugerencias? ¡Estamos para ayudarte!</p>
        </div>
    </header>

    <section class="contacto py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8 animate-slide-in-up">
                    <form class="p-4 glass rounded shadow">
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre completo</label>
                            <input type="text" class="form-control" id="nombre" placeholder="Tu nombre" required>
                        </div>
                        <div class="mb-3">
                            <label for="correo" class="form-label">Correo electrónico</label>
                            <input type="email" class="form-control" id="correo" placeholder="ejemplo@correo.com" required>
                        </div>
                        <div class="mb-3">
                            <label for="mensaje" class="form-label">Mensaje</label>
                            <textarea class="form-control" id="mensaje" rows="5" placeholder="Escribe tu mensaje aquí..." required></textarea>
                        </div>
                        <button type="submit" class="btn btn-purple w-100">Enviar mensaje</button>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer bg-dark text-center text-light py-4">
        <p class="mb-1">© 2025 StickMania. Todos los derechos reservados.</p>
        <div>
            <a href="https://www.facebook.com/alertarondon" target="_blank" rel="noopener noreferrer" class="text-light me-3 text-decoration-none">Facebook</a>
            <a href="https://www.instagram.com/moi_77k/" target="_blank" rel="noopener noreferrer" class="text-light me-3 text-decoration-none">Instagram</a>
            <a href="https://x.com/sandox017" target="_blank" rel="noopener noreferrer" class="text-light text-decoration-none">Twitter</a>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
